name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: TokenBao v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## TokenBao v${{ steps.get_version.outputs.VERSION }}
            
            ### 新功能
            - AI API Token 优化代理
            - 多策略支持（缓存、压缩、路由）
            - 实时统计和预算管理
            
            ### 安装
            - macOS: 下载 DMG 文件安装
            - Windows: 下载 EXE 文件安装
            
            ### 更新方式
            应用启动后自动检查更新
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}